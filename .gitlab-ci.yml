workflow:
  rules:
    # Static analysis runs only when explicitly requested from GitLab or CI automation.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - lint
  - build
  - analyse
  - docs

default:
  interruptible: true
  image: registry.hmc.co.kr/rlab/ardg/arct/project/arch/06-cicd/art-cicd/artf-build:v1.5
  tags:
    - art-server

variables:
  POLYSPACE_ACCESS_PARENT: "art_ws/dtdynamics"
  POLYSPACE_PROJECT_NAME: "dtdynamics"
  POLYSPACE_BIN: "/usr/local/Polyspace_Server/R2025b/polyspace/bin"
  POLYSPACE_TEMPLATES: "/usr/local/Polyspace_Server/R2025b/toolbox/polyspace/psrptgen/templates"
  POLYSPACE_ACCESS_HOST: "10.20.92.67"
  POLYSPACE_ACCESS_PORT: "9444"

lint-job:
  stage: lint
  script:
    - bash ci/lint.sh
  artifacts:
    when: always
    paths:
      - reports/clang-format.txt
    expire_in: 1 week

build-job:
  stage: build
  script:
    - bash ci/build.sh
  artifacts:
    paths:
      - build/
    expire_in: 1 week

polyspace-job:
  stage: analyse
  timeout: 3h
  needs:
    - job: build-job
      artifacts: true
  cache:
    key: "polyspace-baseline-${CI_COMMIT_REF_SLUG}"
    paths:
      - reports/polyspace/results/
    policy: pull-push
  script:
    - bash ci/polyspace.sh
  artifacts:
    when: always
    paths:
      - reports/polyspace/
    expire_in: 1 month

markdown-docs:
  stage: docs
  before_script:
    - |
      if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdffonts >/dev/null 2>&1; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils
      fi
  script:
    - command -v python3
    - python3 tools/validate_documentation_content.py
    - python3 tools/validate_docs.py
