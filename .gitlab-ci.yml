stages:
  - docs

default:
  interruptible: true
  image: registry.hmc.co.kr/rlab/ardg/arct/project/arch/06-cicd/art-cicd/artf-build:v1.2
  tags:
    - artplot-server

markdown-docs:
  stage: docs
  script:
    - command -v python3
    - python3 tools/validate_documentation_content.py
    - python3 tools/validate_docs.py
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
