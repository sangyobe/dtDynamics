stages:
  - docs
  - deploy

default:
  interruptible: true
  image: registry.hmc.co.kr/rlab/ardg/arct/project/arch/06-cicd/art-cicd/artf-build:v1.2
  tags:
    - artplot-server

doxygen-docs:
  stage: docs
  before_script:
    - apt-get update
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      doxygen graphviz python3 texlive-latex-base ghostscript
    - rm -rf /var/lib/apt/lists/*
  script:
    - doxygen --version
    - dot -V
    - command -v python3
    - command -v latex
    - command -v dvips
    - command -v gs
    - DTDYNAMICS_DOCS_OUTPUT_DIR="$CI_PROJECT_DIR/build/docs/doxygen" tools/validate_docs.sh
  artifacts:
    when: always
    name: "dtdynamics-doxygen-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/docs/doxygen/html/
      - build/docs/doxygen/doxygen.log
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy-doxygen-pages:
  stage: deploy
  needs:
    - job: doxygen-docs
      artifacts: true
  script:
    - test -s build/docs/doxygen/html/index.html
  pages:
    publish: build/docs/doxygen/html
    expire_in: never
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
