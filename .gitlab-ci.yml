workflow:
  rules:
    # GitLab 웹 UI(Build > Pipelines > New pipeline)에서 직접 실행한 경우만 Pipeline 생성
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - lint
  - build
  - analyse

default:
  interruptible: true
  image: registry.hmc.co.kr/rlab/ardg/arct/project/arch/06-cicd/art-cicd/artf-build:v1.3
  tags:
    - art-server

variables:
  POLYSPACE_ACCESS_PARENT: "art_ws/dtdynamics"
  POLYSPACE_PROJECT_NAME: "dtdynamics"

  POLYSPACE_BIN: /usr/local/Polyspace_Server/R2025b/polyspace/bin
  POLYSPACE_TEMPLATES: /usr/local/Polyspace_Server/R2025b/toolbox/polyspace/psrptgen/templates
  POLYSPACE_ACCESS_HOST: "10.20.92.67"
  POLYSPACE_ACCESS_PORT: "9444"

lint-job:
  stage: lint
  # TODO: 전체 코드베이스 clang-format 적용 완료 후 allow_failure: false 로 변경
  allow_failure: true
  script:
    - bash ci/lint.sh
  artifacts:
    when: always
    paths:
      - reports/clang-format.txt
    expire_in: 1 week

build-job:
  stage: build
  script:
    - bash ci/build.sh
  artifacts:
    when: always
    paths:
      - build/
    expire_in: 1 week

polyspace-job:
  stage: analyse
  timeout: 3h
  # 결과 확인용, 파이프라인은 계속 진행
  allow_failure: true
  # Polyspace Bug Finder Server 는 호스트에서 Docker 볼륨으로 마운트
  # GitLab Runner 설정 필요: /etc/gitlab-runner/config.toml 의 volumes 에 아래 항목 추가
  #   "/usr/local/Polyspace_Server:/usr/local/Polyspace_Server:ro"
  # Polyspace Access 업로드용 변수는 GitLab CI/CD Settings > Variables 에서 설정:
  #   POLYSPACE_ACCESS_LOGIN, POLYSPACE_ACCESS_ENCRYPTED_PASSWORD
  needs:
    - build-job
  cache:
    key: polyspace-baseline-${CI_COMMIT_REF_SLUG}
    paths:
      - reports/polyspace/results/
    policy: pull-push
  script:
    - bash ci/polyspace.sh
  artifacts:
    when: always
    paths:
      - reports/polyspace/    # CSV, PDF, .psbf 모두 포함
    expire_in: 1 month
